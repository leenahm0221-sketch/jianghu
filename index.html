<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>江湖少年</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="江湖少年">
<meta name="theme-color" content="#0f380f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none}</style>
</head>
<body>
<style>
:root{
  /* Layout: the game picture fills the whole screen; GB-style controls float over it */
  --bg:var(--gb3);
  --gb0:#e8e8e0;--gb1:#a8a8a0;--gb2:#58585a;--gb3:#18181a;
  --pad:rgba(28,30,34,.62);
  --pad-on:rgba(28,30,34,.88);
  --btn:rgba(150,36,46,.9);
  --btn-on:rgba(205,60,70,1);
  --pill:rgba(18,18,20,.8);
  --label:#fff;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--bg);margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.game{position:relative;width:100%;height:100%;overflow:hidden}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ctl{
  position:absolute;left:0;right:0;bottom:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 14px;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:end;row-gap:10px;
}
.ctl > *{pointer-events:auto}
.dpad{grid-column:1;grid-row:1;width:148px;height:148px;position:relative;touch-action:none;cursor:pointer;border-radius:50%;background:var(--pad);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.dpad i{position:absolute;z-index:1;width:0;height:0;border:8px solid transparent;opacity:.9}
.dpad i.u{left:66px;top:12px;border-bottom-color:#e6e6e6;border-top:0}
.dpad i.d{left:66px;bottom:12px;border-top-color:#e6e6e6;border-bottom:0}
.dpad i.l{top:66px;left:12px;border-right-color:#e6e6e6;border-left:0}
.dpad i.r{top:66px;right:12px;border-left-color:#e6e6e6;border-right:0}
.dpad i.on{opacity:1}
.knob{position:absolute;left:46px;top:46px;width:56px;height:56px;border-radius:50%;background:rgba(70,72,78,.85);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.12);pointer-events:none;transition:transform .06s}
.dpad.active .knob{transition:none}
.ab{grid-column:3;grid-row:1;display:flex;gap:16px;padding:0 4px 4px 0;align-items:flex-start}
.btn{display:flex;flex-direction:column;align-items:center;gap:5px}
.btn button{width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:var(--btn);color:#fff;font:800 24px/1 var(--sans);touch-action:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.btn button small{font:700 11px/1 var(--sans);letter-spacing:0;pointer-events:none}
.btn button.on{background:var(--btn-on)}
.ab .btn:first-child{margin-top:28px}
.btn span,.small span{display:none}
.smalls{grid-column:1/4;grid-row:2;display:flex;justify-content:center;gap:22px}
.sgrp{display:flex;gap:12px}
.smalls .small button{width:62px;font:700 14px/1 var(--sans);color:var(--label);letter-spacing:.05em;border:1.5px solid rgba(255,255,255,.7);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.small{display:flex;flex-direction:column;align-items:center;gap:5px}
.small button{width:72px;height:30px;border-radius:15px;border:0;background:var(--pill);touch-action:none;cursor:pointer}
.small button.on{background:var(--pad-on)}
button:focus-visible{outline:2px solid #e0f8d0;outline-offset:3px}
.namebox[hidden]{display:none}
.namebox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nb-card{background:var(--gb0);border:4px solid var(--gb3);box-shadow:0 0 0 3px var(--gb0),0 0 0 6px var(--gb3);padding:18px 16px;width:min(300px,100%);display:flex;flex-direction:column;gap:12px;font:700 15px/1.3 var(--sans);color:var(--gb3)}
.nb-title{font-size:16px;letter-spacing:.06em}
.nb-sub{font-weight:500;font-size:12px;color:var(--gb2)}
#nameinput{font:700 20px/1.2 var(--sans);color:var(--gb3);background:var(--gb1);border:3px solid var(--gb3);padding:8px 10px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text;border-radius:0}
.nbin{font:700 17px/1.2 var(--sans);color:var(--gb3);background:var(--gb1);border:3px solid var(--gb3);padding:8px 10px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text;border-radius:0}
.nbin[hidden]{display:none}
#nameinput:focus{outline:2px dashed var(--gb2);outline-offset:2px}
.nb-row{display:flex;gap:10px}
.nb-row button{flex:1;font:700 15px/1 var(--sans);padding:11px 0;border:3px solid var(--gb3);background:var(--gb1);color:var(--gb3);cursor:pointer;border-radius:0}
.nb-row button.main{background:var(--gb3);color:var(--gb0)}
.nb-err{min-height:14px;font-size:12px;color:var(--gb2)}
.chatlog{position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left,0px));top:62px;width:min(44%,330px);max-height:40%;overflow:hidden;font:500 12px/1.4 var(--sans);color:var(--gb0);background:rgba(0,0,0,.5);padding:5px 8px;pointer-events:none;opacity:0;transition:opacity .4s}
.chatlog.show{opacity:1}
.chatlog p{margin:0;word-break:break-all}
.chatlog b{font-weight:700;color:var(--gb1);margin-right:3px}
.chatlog .me{color:#fff}
.chatbar[hidden]{display:none}
.chatbar{position:absolute;z-index:7;top:max(6px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));display:flex;gap:6px;padding:6px;background:var(--gb3);border:3px solid var(--gb0);box-sizing:border-box}
.chatbar input{flex:1;min-width:0;font:600 16px/1.2 var(--sans);color:var(--gb3);background:var(--gb0);border:0;padding:7px 8px;border-radius:0;-webkit-user-select:text;user-select:text}
.chatbar button{font:700 14px/1 var(--sans);padding:0 10px;border:2px solid var(--gb0);background:var(--gb2);color:var(--gb0);border-radius:0;cursor:pointer}
.chatbar button.main{background:var(--gb0);color:var(--gb3)}
#savecode{font:500 11px/1.35 ui-monospace,Menlo,monospace;color:var(--gb3);background:var(--gb1);border:3px solid var(--gb3);padding:6px 8px;width:100%;height:120px;box-sizing:border-box;resize:none;word-break:break-all;-webkit-user-select:text;user-select:text;border-radius:0}
/* 只有横屏布局 */
.ctl{top:0;align-items:end;padding-block:0 max(8px,env(safe-area-inset-bottom,0px))}
  .ab{padding-bottom:2px}
  .dpad{grid-row:1/3}
  .ab{grid-row:1/3}
  .smalls{grid-column:auto;grid-row:auto;position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));justify-content:space-between;pointer-events:none}
  .smalls .small{pointer-events:auto;flex-direction:row}
  .sgrp{gap:10px;pointer-events:none}
  .small button{width:66px;height:30px}
.rotate{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--gb3);color:var(--gb0);font:700 18px/1.4 var(--sans);text-align:center;padding:24px}
@media (orientation:portrait){.rotate{display:flex}}
.game.fullmap .dpad,.game.fullmap .ab{visibility:hidden}
.rotate .ph{width:54px;height:90px;border:4px solid var(--gb0);border-radius:10px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.rotate small{font-weight:500;font-size:13px;color:var(--gb1)}
</style>

<div class="game" id="game">
  <div class="namebox" id="namebox" hidden>
    <form class="nb-card" id="nbform" autocomplete="off">
      <div class="nb-title" id="nbtitle">少侠尊姓大名？</div>
      <div class="nb-sub">名字会显示在人物头顶，一到六个字。</div>
      <input id="nameinput" maxlength="6" placeholder="例如：张无忌" aria-label="角色名字">
      <div class="nb-err" id="nberr"></div>
      <div class="nb-row"><button type="button" id="nbrand">随机一个</button><button type="submit" class="main" id="nbok">行走江湖</button></div>
    </form>
  </div>
  <div class="namebox" id="savebox" hidden>
    <div class="nb-card">
      <div class="nb-title" id="sbtitle">存档码</div>
      <div class="nb-sub" id="sbsub"></div>
      <textarea id="savecode" spellcheck="false" aria-label="存档码"></textarea>
      <div class="nb-err" id="sberr"></div>
      <div class="nb-row"><button type="button" id="sbclose">关闭</button><button type="button" class="main" id="sbok">复制</button></div>
    </div>
  </div>
  <div class="rotate" id="rotate"><div class="ph"></div><div>请把手机横过来玩</div><small>本游戏只支持横屏。<br>iPhone 请先在控制中心关闭「竖排方向锁定」。</small></div>
  <div class="namebox" id="authbox" hidden>
    <form class="nb-card" id="authform" autocomplete="on">
      <div class="nb-title" id="authtitle">登录江湖</div>
      <div class="nb-sub" id="authsub">账号是英文字母或数字，角色名会显示在头顶。</div>
      <input class="nbin" id="authuser" name="username" autocomplete="username" maxlength="16" placeholder="账号" aria-label="账号">
      <input class="nbin" id="authpass" name="password" type="password" autocomplete="current-password" maxlength="64" placeholder="密码（至少 6 位）" aria-label="密码">
      <input class="nbin" id="authname" maxlength="6" placeholder="角色名（一到六个字）" aria-label="角色名" hidden>
      <div class="nb-err" id="autherr"></div>
      <div class="nb-row"><button type="button" id="authswitch">没有账号？注册</button><button type="submit" class="main" id="authok">登录</button></div>
      <div class="nb-row"><button type="button" id="authback">返回</button></div>
    </form>
  </div>
  <div class="chatlog" id="chatlog" aria-live="polite"></div>
  <form class="chatbar" id="chatbar" autocomplete="off" hidden>
    <button type="button" id="chch" aria-label="切换频道">附近</button>
    <input id="chatin" maxlength="40" placeholder="说点什么…（回车发送）" aria-label="聊天内容">
    <button type="submit" class="main">发送</button>
    <button type="button" id="chatx" aria-label="关闭聊天">×</button>
  </form>
  <canvas id="screen" aria-label="游戏画面"></canvas>
  <div class="ctl" id="ctl">
    <div class="dpad" id="dpad" aria-label="方向键"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><span class="knob" id="knob"></span></div>
    <div class="ab">
      <div class="btn"><button data-k="b" aria-label="B 打坐或返回">B<small>打坐·返回</small></button><span>打坐·返回</span></div>
      <div class="btn"><button data-k="a" aria-label="A 攻击或确定">A<small>攻击·确定</small></button><span>攻击·确定</span></div>
    </div>
    <div class="smalls">
      <div class="sgrp">
        <div class="small"><button data-k="select" aria-label="换武器">换武器</button></div>
        <div class="small"><button data-k="map" aria-label="地图">地图</button></div>
      </div>
      <div class="sgrp">
        <div class="small"><button data-k="chat" aria-label="聊天">聊天</button></div>
        <div class="small"><button data-k="start" aria-label="菜单">菜单</button></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
/* Palettes: real DMG pea-green LCD, the grey Pocket LCD, and a brighter backlit look */
const PALETTES = [
  { name: '黑白', c: ['#e8e8e0', '#a8a8a0', '#58585a', '#18181a'] },
  { name: '豆绿', c: ['#9bbc0f', '#8bac0f', '#306230', '#0f380f'] },
  { name: '口袋', c: ['#c4cfa1', '#8b956d', '#4d533c', '#1f1f1f'] },
  { name: '背光', c: ['#e0f8d0', '#88c070', '#346856', '#081820'] },
];
let palIdx = 0;
try { palIdx = clamp0(parseInt(localStorage.getItem('jianghu-pal2') || '0', 10)); } catch (e) { palIdx = 0; }
function clamp0(v) { return v >= 0 && v < PALETTES.length ? v : 0; }
let PAL = PALETTES[palIdx].c.slice();
const T = 16;
let GW = 160, GH = 144, UX = 0, UB = 144, SCALE = 4;

const screen = document.getElementById('screen');
const sc = screen.getContext('2d');
const world = document.createElement('canvas'); world.width = GW; world.height = GH;
const g = world.getContext('2d');
g.imageSmoothingEnabled = false;

function R(x, y, w, h, c) { g.fillStyle = PAL[c]; g.fillRect(Math.floor(x), Math.floor(y), w, h); }

  const bld = (b) => {
    b.w = b.w || 5; b.h = b.h || 3; b.style = b.style || 'hall';
    for (let y = b.y - 1; y <= b.y + b.h; y++) for (let x = b.x - 1; x <= b.x + b.w; x++) if (inside(x, y) && !(m[y][x] === 'E')) { m[y][x] = sp.plaza || '_'; keep.add(K(x, y)); }
    for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) { m[y][x] = 'H'; keep.add(K(x, y)); }
    buildings.push(b);
    const dx = b.x + Math.floor(b.w / 2), dy = b.y + b.h;
    path(dx, dy + 1, hub[0], hub[1], sp.plaza || '_');
    return [dx, dy];
  };
  const ctx = { m, set, carve, rect, path, keep, K, rng, W, H, hub, bld, npc: n => npcDefs.push(n), spawn: (k, x, y) => { fixed.push([k, x, y]); keep.add(K(x, y)); }, sign: (x, y, t) => { set(x, y, 'S'); keep.add(K(x, y)); extraSigns[`${x},${y}`] = t; } };
  if (sp.build) sp.build(ctx);
  /* 树、石头成片生长：粗网格随机值插值出“疏密” */
  const gw = Math.ceil(W / 6) + 2, gh = Math.ceil(H / 6) + 2, grid = [];
  for (let i = 0; i < gw * gh; i++) grid.push(rng());
  const noise = (x, y) => { const fx = x / 6, fy = y / 6, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0, v = (i, j) => grid[(y0 + j) * gw + x0 + i]; return (v(0, 0) * (1 - tx) + v(1, 0) * tx) * (1 - ty) + (v(0, 1) * (1 - tx) + v(1, 1) * tx) * ty; };
  const fillable = new Set([sp.floor, ...(sp.fillOn || [])]);
  const wsum = (sp.obst || []).reduce((a, [, w]) => a + w, 0);
  const nearExit = (x, y) => Object.values(exits).some(([ex, ey]) => Math.abs(ex - x) + Math.abs(ey - y) <= 3);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (keep.has(K(x, y)) || !fillable.has(m[y][x]) || nearExit(x, y)) continue;
    const nz = noise(x, y); if (rng() < (sp.density || 0) * (0.05 + 2.8 * nz * nz * nz)) {
      let r = rng() * wsum; for (const [t, w] of sp.obst) { r -= w; if (r <= 0) { m[y][x] = t; break; } }
    }
  }
  const walk = (x, y) => !SOLID.has(m[y][x]) || m[y][x] === 'E';
  const reach = () => {
    const seen = new Set([K(hub[0], hub[1])]), q = [[hub[0], hub[1]]];
    while (q.length) { const [x, y] = q.shift(); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H || seen.has(K(nx, ny)) || !walk(nx, ny)) continue; seen.add(K(nx, ny)); q.push([nx, ny]); } }
    return seen;
  };
  /* 采集点、箱子：放在走得到的空地上，四周至少三面能走，不会把路堵死 */
  let R1 = reach();
  const openAround = (x, y) => [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => R1.has(K(x + dx, y + dy))).length;
  const place = (t, n) => {
    for (let k = 0, tries = 0; k < n && tries < 4000; tries++) {
      const x = 2 + Math.floor(rng() * (W - 4)), y = 2 + Math.floor(rng() * (H - 4));
      if (!R1.has(K(x, y)) || keep.has(K(x, y)) || SOLID.has(m[y][x]) || nearExit(x, y) || openAround(x, y) < 3) continue;
      m[y][x] = t; keep.add(K(x, y)); R1.delete(K(x, y)); k++;
    }
  };
  for (const t in sp.res || {}) place(t, sp.res[t]);
  if (sp.chests) place('X', sp.chests);
  /* 出口旁的路牌 */
  const signs = { ...extraSigns };
  for (const k in exits) {
    const [x, y] = exits[k], [ix, iy] = exitInner({ x, y }, W, H), to = EXIT_TO[id][k];
    const cand = y === 0 || y === H - 1 ? [[ix + 1, iy], [ix - 1, iy]] : [[ix, iy - 1], [ix, iy + 1]];
    for (const [sx, sy] of cand) if (inside(sx, sy) && !keep.has(K(sx, sy)) && !SOLID.has(m[sy][sx])) { m[sy][sx] = 'S'; signs[`${sx},${sy}`] = `路牌：往${SPEC_NAME[to]}。${AREA_HINT[to] ? '\n' + AREA_HINT[to] : ''}`; break; }
  }
  /* 放怪：每种怪在自己的那一片里，离出口远一点，彼此隔开 */
  R1 = reach();
  const spawns = [...fixed], used = fixed.map(([, x, y]) => [x, y]);
  for (const z of sp.zones || []) {
    const [fx0, fy0, fx1, fy1] = z.area || [0, 0, 1, 1];
    const x0 = Math.max(1, Math.floor(W * fx0)), x1 = Math.min(W - 2, Math.ceil(W * fx1)), y0 = Math.max(1, Math.floor(H * fy0)), y1 = Math.min(H - 2, Math.ceil(H * fy1));
    for (let k = 0, tries = 0; k < z.n && tries < 3000; tries++) {
      const x = x0 + Math.floor(rng() * (x1 - x0 + 1)), y = y0 + Math.floor(rng() * (y1 - y0 + 1));
      if (!R1.has(K(x, y)) || m[y][x] === 'E' || Object.values(exits).some(([ex, ey]) => Math.abs(ex - x) + Math.abs(ey - y) < 6)) continue;
      if (used.some(([ux, uy]) => Math.abs(ux - x) + Math.abs(uy - y) < 3)) continue;
      used.push([x, y]); spawns.push([z.kind, x, y]); k++;
    }
  }
  return { rows: m.map(r => r.join('')), spawns, signs, buildings, npcDefs };
}

/* ---------- 城镇：城墙、城门、十字大街，房子按位置摆 ---------- */
function genTown(id, sp) {
  const W = sp.W, H = sp.H, rng = mkRng(sp.seed), m = blank(W, H, 'W', sp.floor || '.');
  const set = (x, y, c) => { if (x > 0 && y > 0 && x < W - 1 && y < H - 1) m[y][x] = c; };
  const rect = (x0, y0, w, h, c) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) set(x, y, c); };
  const st = sp.street || 12;
  rect(1, st, W - 2, 2, '_');
  const exits = EXIT_AT[id];
  for (const k in exits) {
    const [x, y] = exits[k]; m[y][x] = 'E';
    if (y === 0 || y === H - 1) { m[y][x - 1] = 'Q'; m[y][x + 1] = 'Q'; const [, iy] = exitInner({ x, y }, W, H); for (let yy = Math.min(iy, st); yy <= Math.max(iy, st + 1); yy++) set(x, yy, '_'); }
    else { m[y - 1][x] = 'Q'; m[y + 1][x] = 'Q'; for (let yy = Math.min(y, st); yy <= Math.max(y, st + 1); yy++) set(x === 0 ? 1 : W - 2, yy, '_'); }
  }
  for (const [t, x0, y0, w, h] of sp.rects || []) rect(x0, y0, w, h, t);
  const buildings = sp.buildings.map(b => ({ ...b, w: b.w || 5, h: b.h || 3, style: b.style || 'hall' }));
  const front = new Set();
  for (const b of buildings) { rect(b.x, b.y, b.w, b.h, 'H'); for (let x = b.x - 1; x <= b.x + b.w; x++) front.add(`${x},${b.y + b.h}`); }
  for (const n of sp.npcs || []) for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) front.add(`${n.x + dx},${n.y + dy}`);
  /* 空着的街区补上民居，城里看起来住满了人 */
  const fl = sp.floor || '.';
  const free = (x0, y0, w, h) => { for (let y = y0 - 1; y <= y0 + h; y++) for (let x = x0 - 1; x <= x0 + w; x++) { if (y < 1 || x < 1 || y > H - 2 || x > W - 2 || m[y][x] !== fl || front.has(`${x},${y}`)) return false; } return true; };
  for (let y = 2; y < H - 4; y++) for (let x = 2; x < W - 6; x++) {
    const w = rng() < 0.5 ? 4 : 5;
    if (rng() < 0.5 || !free(x, y, w, 3)) continue;
    const b = { x, y, w, h: 3, style: 'hall', kind: rng() < 0.55 ? 'house' : 'home' };
    buildings.push(b); rect(x, y, w, 3, 'H'); for (let xx = x - 1; xx <= x + w; xx++) front.add(`${xx},${y + 3}`);
  }
  const signs = {};
  for (const k in exits) {
    const [x, y] = exits[k], [ix, iy] = exitInner({ x, y }, W, H), to = EXIT_TO[id][k];
    const [sx, sy] = y === 0 || y === H - 1 ? [ix + 2, iy] : [ix, iy - 2];
    if (m[sy] && m[sy][sx] === (sp.floor || '.')) { m[sy][sx] = 'S'; signs[`${sx},${sy}`] = `${SPEC_NAME[id]}${{ N: '北', S: '南', E: '东', W: '西' }[k[0]]}门。往${SPEC_NAME[to]}。${AREA_HINT[to] ? '\n' + AREA_HINT[to] : ''}`; }
  }
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (m[y][x] !== (sp.floor || '.') || front.has(`${x},${y}`) || m[y - 1][x] === 'H') continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => m[y + dy][x + dx] === 'E' || m[y + dy][x + dx] === 'Q')) continue;
    const r = rng();
    if (r < 0.035) m[y][x] = sp.tree || 'T'; else if (r < 0.06) m[y][x] = 'f';
  }
  for (const [x, y] of sp.wells || []) m[y][x] = 'o';
  return { rows: m.map(r => r.join('')), spawns: [], signs: { ...signs, ...(sp.signs || {}) }, buildings, npcDefs: sp.npcs || [] };
}

function questMark(n) {
  const q = S.q;
  switch (n.id) {
    case 'chief': return q.main === 0 ? '!' : (q.main < CH1_END && mainDone()) ? '?' : null;
    case 'doctor': { const s = S.side.lianyao || 0; return s === 0 ? '!' : (s === 1 && S.items.caoyao >= 5) ? '?' : null; }
    case 'smith': { const s = S.side.duanzao || 0; return (s === 0 && q.main >= 2) ? '!' : (s === 1 && S.items.langpi >= 3) ? '?' : null; }
    case 'tao':
      if (S.sect === 'quanzhen' && (hasGift('quanzhen') || (S.stask && S.stask.sect === 'quanzhen' && sectTaskDone(S.stask)))) return '?';
      if (S.skills.quanzhen == null) return bestAtk() >= 5 ? '!' : null;
      if (!S.sect && lv('quanzhen') >= 10) return '!';
      return S.sect === 'quanzhen' && canLearnSect('quanzhen') ? '!' : null;
    case 'fangzhang': case 'shitai': case 'mjshi': case 'chiyan': case 'huadaozhu': case 'wdzhang': case 'hszhang': case 'tmzhu': case 'sunpo': case 'xxlao': case 'lanjz': {
      const sect = Object.keys(MASTER_IDS).find(k => MASTER_IDS[k] === n.id);
      if (S.purge && S.purge.sect === sect && S.purge.done) return '?';
      if (S.sect === sect && (hasGift(sect) || (S.stask && S.stask.sect === sect && sectTaskDone(S.stask)))) return '?';
      if (!S.sect) return SECT_JOIN[sect].ok() && !campBlock(sect) ? '!' : null;
      return S.sect === sect && canLearnSect(sect) ? '!' : null;
    }
    case 'fisher': return !S.items.yugan ? '!' : null;
    case 'fenglao': case 'tingyu': case 'shusheng': case 'simei': case 'dubi': { const h = HERMITS[Object.keys(HERMITS).find(k => HERMITS[k].npc === n.id)]; return S.skills[h.skill] == null && h.ok() && !reqFail(h.skill) ? '!' : null; }
    case 'caifeng': { const s2 = S.side.fangzhi || 0; return s2 === 0 ? '!' : (s2 === 1 && S.items.mianhua >= 3) ? '?' : null; }
    case 'inn': { const s2 = S.side.pengren || 0; return (s2 === 0 && S.items.yugan) ? '!' : (s2 === 1 && S.items.jiyu >= 3) ? '?' : null; }
    case 'baixiao': { if (q.main === CH1_END) return '!'; if (q.main > CH1_END && q.main < MAIN_END && mainDone()) return '?'; const t = curTrial(); if (t && trialDone(t)) return '?'; return !S.llCur && nextTrial() ? '!' : null; }
    case 'biaotou': return !S.bounty ? '!' : S.bounty.cnt >= S.bounty.need ? '?' : null;
    case 'lu':
      if (S.sect === 'gaibang' && (hasGift('gaibang') || (S.stask && S.stask.sect === 'gaibang' && sectTaskDone(S.stask)))) return '?';
      if (!S.sect) { const s = S.side.gaibang || 0; return s === 0 ? '!' : S.items.tourou >= 5 ? '?' : null; }
      return S.sect === 'gaibang' && canLearnSect('gaibang') ? '!' : null;
  }
  return null;
}
const nameOf = id => (EQ[id] || ITEMS[id]).name;
function buy(who, ids, back) {
  const price = id => (EQ[id] ? EQ[id].price : ITEMS[id].buy);
  ask(who, `看中哪件？你身上有 ${S.silver} 两。`, ids.map(id => `${nameOf(id)} ${price(id)}两`).concat(['返回']), i => {
    if (i >= ids.length) return back();
    const id = ids[i];
    if (S.silver < price(id)) return say(who, `${nameOf(id)}要 ${price(id)} 两，你的银子不够。`, () => buy(who, ids, back));
    S.silver -= price(id); sfx('coin');
    if (EQ[id]) { S.gear.push(id); equipItem(id); save(); return say(who, `${nameOf(id)}已经给你穿戴上了。`, () => buy(who, ids, back)); }
    S.items[id] = (S.items[id] || 0) + 1; toast(`得到 ${nameOf(id)}`); save(); buy(who, ids, back);
  });
}
function spareGear() {
  const cnt = {};
  for (const id of S.gear) cnt[id] = (cnt[id] || 0) + 1;
  return Object.keys(cnt).filter(id => id !== 'buyi' && cnt[id] - (S.equip[EQ[id].slot] === id ? 1 : 0) > 0);
}
function sellMenu(who, buyer, back) {
  const list = Object.keys(ITEMS).filter(k => (buyer === 'any' ? ITEMS[k].sell > 0 && !ITEMS[k].book : ITEMS[k].buyer === buyer) && S.items[k] > 0).map(k => ({
    txt: `${ITEMS[k].name}×${S.items[k]} ${ITEMS[k].sell * S.items[k]}两`, go: () => { S.silver += ITEMS[k].sell * S.items[k]; S.items[k] = 0; },
  }));
  if (buyer === 'smith' || buyer === 'any') for (const id of spareGear()) list.push({ txt: `${EQ[id].name} ${EQ[id].sell}两`, go: () => { S.gear.splice(S.gear.indexOf(id), 1); S.silver += EQ[id].sell; } });
  const shown = list.slice(0, 5);
  if (!shown.length) return say(who, '你身上没有我收的东西。', back);
  ask(who, '都按公道价收。', shown.map(l => l.txt).concat(['返回']), i => {
    if (i >= shown.length) return back();
    shown[i].go(); sfx('coin'); save(); sellMenu(who, buyer, back);
  });
}
/* 生产：成功率看熟练度，失败损耗一半材料；做得越多手艺越好 */
function craft(who, list, skill, back) {
  const v = lv(skill);
  const rate = d => Math.round(clamp(60 + v * 0.8 - d, 10, 98));
  const matTxt = m => Object.entries(m).map(([k, n]) => `${ITEMS[k].name}${n}`).join('');
  ask(who, `你的${SK[skill].name}是 ${v.toFixed(2)}，手艺越好越不容易失败。`, list.map(([id, m, d]) => `${nameOf(id)} ${matTxt(m)} ${rate(d)}%`).concat(['返回']), i => {
    if (i >= list.length) return back();
    const [id, m, d] = list[i];
    const lack = Object.entries(m).find(([k, n]) => (S.items[k] || 0) < n);
    if (lack) return say(who, `${ITEMS[lack[0]].name}不够，要 ${lack[1]} 个，你只有 ${S.items[lack[0]] || 0} 个。`, () => craft(who, list, skill, back));
    const ok = Math.random() * 100 < rate(d);
    for (const [k, n] of Object.entries(m)) S.items[k] -= ok ? n : Math.ceil(n / 2);
    if (ok) {
      if (EQ[id]) S.gear.push(id); else S.items[id] = (S.items[id] || 0) + 1;
      train(skill, 8); sfx('coin'); save();
      say(who, `成了！得到 ${nameOf(id)}。${EQ[id] ? '在菜单“装备”里可以换上，多余的可以卖给兵器铺。' : ''}`, () => craft(who, list, skill, back));
    } else { train(skill, 3); sfx('hurt'); save(); say(who, '火候没掌握好，失败了……材料损耗了一半。', () => craft(who, list, skill, back)); }
  });
}

  if (d.lv >= 60 && !d.camp && Math.random() < (e.kind === 'gongsun' ? 0.5 : 0.03)) { const g = RARE[rnd(0, RARE.length - 1)]; S.gear.push(g); toast(`得到稀有装备：${EQ[g].name}！`); sfx('level'); }
  if (e.kind === 'gongsun') addRep(20);
  const stk = S.stask;
  if (stk && stk.cnt < stk.n && ((stk.type === 'kill' && stk.kind === e.kind) || (stk.type === 'patrol' && d.camp === stk.foe))) { stk.cnt++; toast(stk.cnt >= stk.n ? '门务完成，回师门复命' : `门务 ${stk.cnt}/${stk.n}`); }
  const tr = curTrial();
  if (tr && tr.kind === e.kind && S.llCnt < tr.need) { S.llCnt++; toast(S.llCnt >= tr.need ? '历练完成，回襄阳找百晓生' : `历练 ${S.llCnt}/${tr.need}`); }
  const bt = S.bounty;
  if (bt && bt.kind === e.kind && bt.cnt < bt.need) { bt.cnt++; toast(bt.cnt >= bt.need ? '悬赏完成，回镖局领赏' : `悬赏 ${EN[e.kind].name} ${bt.cnt}/${bt.need}`); }
  const m = MAIN[S.q.main];
  if (m && m.kind === e.kind && S.q.cnt < m.need) { S.q.cnt++; toast(S.q.cnt >= m.need ? `${m.text}完成，回报${GIVER_NAME[mainGiver()]}` : `${m.text} ${S.q.cnt}/${m.need}`); }
  if (d.flag && !S.flags[d.flag]) mainBossDown(e, d);
  if (d.boss) {
    S.flags.boss = true; S.silver += 60; addAlign(5, 0); addRep(10);
    const gotBook = S.skills.shenxing == null && !S.items.book_shenxing;
    if (gotBook) S.items.book_shenxing = 1;
    sfx('level'); save();
    say('黑风寨主', ['好……好身手……', gotBook ? '（他怀中掉出一本薄册子）' : '（他倒了下去）'], () => say(null, [gotBook ? '你得到了神行百变秘籍！草上飞练到 20 级就能在行囊里研读。' : '黑风寨主伏诛。', '另得银两六十两。快回村告诉王村长吧。']));
  }

}
/* 挨打：先看步法和所用武功的闪躲能否闪开；身体受伤扣活力，同时伤到头/臂/腿其中一处；护体和衣帽按部位减伤；挨打后要等回击速度才能还手 */
const PART_IDX = { head: 1, arm: 2, leg: 3 };
function hurtPlayer(dmg, src) {
  if (P.dead) return;
  if (P.fish) { P.fish = null; toast('鱼竿被打掉了！'); }
  let hitp = 88 - pv('步法', 'eva') * 0.3 - (RV[atkSk().eva] - 1) * 20 + (injured('leg') ? 10 : 0);
  if (P.sit) hitp = 100;
  if (Math.random() * 100 > clamp(hitp, 35, 95)) {
    floatText(P.px + 8, P.py, '闪');
    train(S.passive['步法'], 0.5 * trainFactor(lv(S.passive['步法']), EN[src.kind]));
    return;
  }
  if (P.sit) { dmg = Math.round(dmg * 1.5); P.sit = false; toast('打坐被打断！'); }
  const r = Math.random(), part = r < 0.2 ? 'head' : r < 0.6 ? 'arm' : 'leg', pi = PART_IDX[part];
  const body = Math.max(1, Math.round(dmg * (1 - Math.min(0.6, pv('护体', 'def', 0) * 0.0035)) - defense(0)));
  const hurt = Math.max(0, Math.round(dmg * 0.8 * (1 - Math.min(0.6, pv('护体', 'def', pi) * 0.0035)) - defense(pi)));
  S.hp -= body;
  const was = injured(part);
  S.parts[part] = Math.max(0, S.parts[part] - hurt);
  if (!was && injured(part)) toast(PART_MSG[part]);
  P.hurtT = 30; shake = 6; lastFight = frame;
  P.atkCD = Math.max(P.atkCD, Math.round(16 / RV[atkSk().rec]));
  floatText(P.px + 8, P.py, `-${body}`);
  sfx('hurt');
  train(S.passive['护体'], trainFactor(lv(S.passive['护体']), EN[src.kind]));
  if (!P.target && src && !heldDir() && !P.moving) P.target = src;
  if (S.hp <= 0 || S.parts.head <= 0) die(S.parts.head <= 0);
}
function die(headHit) {
  S.hp = 0; P.dead = true; P.sit = false; P.target = null; sfx('die');
  const lost = Math.floor(S.silver * 0.2); S.silver -= lost;
  if (lost) toast('身上的银子丢了些。存进钱庄就不会丢');
  say(null, [headHit ? '头部受了重击，你眼前一黑……' : '你力竭倒地，昏了过去……', `醒来时，已躺在客栈的床上。${lost ? `（丢了 ${lost} 两银子）` : ''}`], () => {
    P.dead = false; S.hp = Math.ceil(maxHP() * 0.6); S.st = maxST();
    for (const k of ['head', 'arm', 'leg']) S.parts[k] = Math.max(S.parts[k], Math.ceil(maxPart() * 0.5));
    enterMap('village', 5, 6, 'down'); save();
  });
}

/* ---------------- enemies ---------------- */
function updEnemies() {
  for (const e of enemies) {
    const d = EN[e.kind];
    if (e.dead) {
      if (e.respawn !== Infinity && --e.respawn <= 0) {
        if (!occupied(e.home.x, e.home.y, e) && Math.abs(P.tx - e.home.x) + Math.abs(P.ty - e.home.y) > 5) Object.assign(e, makeEnemy(e.kind, e.home.x, e.home.y));
        else e.respawn = 120;
      }
      continue;
    }
    if (e.hitT > 0) e.hitT--;
    if (d.dummy) continue;
    if (e.poisonT > 0) { e.poisonT--; if (e.poisonT % 60 === 0) { hurtEnemy(e, e.poisonD, `毒${e.poisonD}`); if (e.dead) continue; } }
    if (e.cd > 0) e.cd--;
    if (e.moving) { stepEnt(e, d.mv); continue; }
    if (e.stunT > 0) { e.stunT--; continue; }
    const dx = P.tx - e.tx, dy = P.ty - e.ty, dist = Math.abs(dx) + Math.abs(dy);
    if (dx) e.face = dx > 0 ? 'right' : 'left';
    const calmCamp = d.camp && !campHostile(d.camp) && !e.provoked;
    if (!d.passive && !calmCamp && dist === 1 && !P.dead && !P.moving) {
      e.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
      if (!e.adj) { e.adj = true; e.cd = Math.max(e.cd, 28); }
      if (e.cd <= 0) {
        let dmg = Math.round(d.atk * (0.8 + Math.random() * 0.4));
        if (e.kind === 'boss' && ++e.combo % 3 === 0) { dmg = Math.round(dmg * 1.8); floatText(e.px + 8, e.py - 6, '黑风掌！', true); }
        e.cd = d.cd; e.lunge = 8;
        hurtPlayer(dmg, e);
      }
      continue;
    }
    if (dist > 1 && !d.passive && !d.camp && !d.hunter) e.adj = false;
    if (d.intro && dist <= 3 && !S.flags[e.kind + 'Met']) {
      S.flags[e.kind + 'Met'] = true;
      say(d.name, d.intro);
      return;
    }
    if (e.kind === 'boss' && dist <= 3 && !S.flags.bossMet) {
      S.flags.bossMet = true;
      say('黑风寨主', ['哪来的毛头小子，也敢闯我黑风寨？', '吃我一记黑风掌！']);
      return;
    }
    if (--e.stepT > 0) continue;
    e.stepT = d.step + rnd(0, 6);
    let tries = [];
    if (d.passive && e.adj && dist <= 4) {
      tries = [[-Math.sign(dx), 0], [0, -Math.sign(dy)], [0, Math.random() < 0.5 ? 1 : -1], [Math.random() < 0.5 ? 1 : -1, 0]].filter(([a, b]) => a || b);
      if (Math.random() < 0.4) tries = [];
    } else if (!d.passive && !calmCamp && dist <= d.sight && !P.dead) {
      const ax = [Math.sign(dx), 0], ay = [0, Math.sign(dy)];
      tries = (Math.abs(dx) >= Math.abs(dy) ? [ax, ay] : [ay, ax]).filter(([a, b]) => a || b);
    } else {
      if (dist > 6) e.adj = false;
      const hd = Math.abs(e.tx - e.home.x) + Math.abs(e.ty - e.home.y);
      if (hd > 3) tries = [[Math.sign(e.home.x - e.tx), 0], [0, Math.sign(e.home.y - e.ty)]].filter(([a, b]) => a || b);
      else if (Math.random() < 0.45) { const k = Object.keys(DIRS)[rnd(0, 3)]; tries = [DIRS[k]]; }
    }
    for (const [mx, my] of tries) {
      if (canMove(e.tx + mx, e.ty + my, e)) {
        e.tx += mx; e.ty += my; e.moving = true;
        e.dir = mx > 0 ? 'right' : mx < 0 ? 'left' : my > 0 ? 'down' : 'up';
        if (mx) e.face = mx > 0 ? 'right' : 'left';
        break;
      }
    }
  }
}
function updNpcs() {
  for (const n of npcs) if (frame % 150 === (n.x * 7) % 150 && Math.random() < 0.5) n.dir = Object.keys(DIRS)[rnd(0, 3)];
}

/* ---------------- main update ---------------- */
const allFull = () => S.hp >= maxHP() && S.mp >= maxMP() && S.st >= maxST() && ['head', 'arm', 'leg'].every(k => S.parts[k] >= maxPart());
function update() {
  frame++;
  if (!nameBox.hidden) return;
  if (mode === 'title') return updTitle();
  if (mode === 'naming' || mode === 'auth') return;
  if (banner && --banner.t <= 0) banner = null;
  for (const t of toasts) t.t--;
  toasts = toasts.filter(t => t.t > 0);
  fx.forEach(f => f.t--); fx = fx.filter(f => f.t > 0);
  if (shake > 0) shake--;
  sparks.forEach(k => k.t--); sparks = sparks.filter(k => k.t > 0);
  if (dlg) return updDialog();
  if (menu) return updMenu();
  if (hitStop > 0) { hitStop--; return; }
  if (++S.ageT >= ageFrames(S.age)) { S.ageT = 0; S.age++; toast(`你已 ${S.age} 岁，元气增长到 ${qi()}`); sfx('level'); if (TRIALS.some(t => t.age === S.age)) toast('百晓生那里有新的历练'); }
  updPlayer(); updEnemies(); updNpcs();
  if (!P.dead) {
    const xf = pv('心法', 'mp'), calm = frame - lastFight > 300, q = qi();
    const sm = S.passive['心法'] ? 1 + xf / 25 : 0.6;
    const wasFull = allFull();
    S.mp = Math.min(maxMP(), S.mp + (P.sit ? 0.05 * sm : 0.01 * (1 + xf / 25)));
    S.hp = Math.min(maxHP(), S.hp + (P.sit ? 0.07 * sm : calm ? 0.012 * (1 + q / 40) : 0));
    const pr = P.sit ? 0.04 * sm : calm ? 0.006 * (1 + q / 40) : 0.002;
    const resting = frame - (P.lastAtk || -999) > 45;
    S.st = Math.min(maxST(), S.st + (P.sit ? 0.35 : resting ? 0.12 : 0.06));
    for (const k of ['head', 'arm', 'leg']) S.parts[k] = Math.min(maxPart(), S.parts[k] + pr);
    if (P.sit && !wasFull && allFull()) toast('气息圆满，伤势尽复');
    if (P.sit) train(S.passive['心法'], 0.012);
  }
  if (++saveTimer > 60 * 30) { saveTimer = 0; save(); }
}

/* 存档码：浏览器存储可能被清掉，换设备也带不走，所以给一串可以复制保存的文字 */

function decodeSave(code) {

  try { const o = JSON.parse(decodeURIComponent(escape(atob(code.slice(SAVE_PREFIX.length))))); return o && o.skills && o.q ? o : null; } catch (e) { return null; }
}
const saveBox = document.getElementById('savebox'), saveCode = document.getElementById('savecode'), sbErr = document.getElementById('sberr'), sbOk = document.getElementById('sbok');

/* ---------------- 联网（第 1 步）：登录、云存档、同图看见彼此、聊天 ----------------
   只有从游戏服务器打开网页时才会联网；GitHub 网页版和 Claude 里预览都是单机。也可以在网址后加 ?server=ws://地址/ws 指定服务器 */
const NET = { url: null, ws: null, status: 'off', online: false, id: null, others: new Map(), dirty: false, lastSave: 0, lastPos: '', lastPosF: 0, lastProf: '', retry: 0, wantAuth: null };
NET.url = (() => {
  const q = new URLSearchParams(location.search).get('server'); if (q) return q;
  if (!/^https?:$/.test(location.protocol) || /github\.io$|claude|anthropic|localhost$|127\.0\.0\.1/.test(location.hostname) && !/[?&]net=1/.test(location.search)) return null;
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
})();
const NET_TOKEN_KEY = 'jianghu-token';
const netSend = o => { if (NET.ws && NET.ws.readyState === 1) NET.ws.send(JSON.stringify(o)); };
function netConnect() {
  if (!NET.url || NET.status === 'connecting' || NET.status === 'up') return;
  NET.status = 'connecting';
  let ws; try { ws = new WebSocket(NET.url); } catch (e) { NET.status = 'off'; return; }
  NET.ws = ws;
  const to = setTimeout(() => { if (NET.status === 'connecting') { try { ws.close(); } catch (e) {} } }, 4000);
  ws.onopen = () => { clearTimeout(to); NET.status = 'up'; NET.retry = 0; if (NET.wantAuth) { netSend(NET.wantAuth); NET.wantAuth = null; } else if (NET.online) { const tk = getToken(); if (tk) netSend({ t: 'resume', token: tk }); } };
  ws.onclose = () => {
    clearTimeout(to); const was = NET.status; NET.status = 'off'; NET.ws = null; NET.others.clear();
    if (NET.online) { if (was === 'up') toast('和服务器断开了，正在重连…'); setTimeout(netConnect, Math.min(10000, 1500 * ++NET.retry)); }
  };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } netOn(m); };
}
const getToken = () => { try { return localStorage.getItem(NET_TOKEN_KEY); } catch (e) { return null; } };
const setToken = t => { try { if (t) localStorage.setItem(NET_TOKEN_KEY, t); else localStorage.removeItem(NET_TOKEN_KEY); } catch (e) {} };
function netAuth(msg) { if (NET.status === 'up') netSend(msg); else { NET.wantAuth = msg; netConnect(); } }
function netOn(m) {
  switch (m.t) {
    case 'auth':
      if (!m.ok) { if (m.expired) setToken(null); if (NET.online && S) { NET.online = false; toast('登录失效，请回到标题画面重新登录'); } authErr(m.err); if (authBox.hidden && mode === 'title') openAuth('login'); return; }
      setToken(m.token); NET.id = m.id; NET.lastPos = ''; NET.lastProf = ''; NET.others.clear();
      if (NET.online && S) { NET.dirty = true; toast('重新连上服务器了'); return; }  // 断线重连：沿用手上的进度
      NET.online = true; closeAuth();
      if (m.fresh || !m.save) beginGame('新的江湖', m.name);
      else { beginGame('继续江湖', null, m.save); S.name = m.name; }
      chatPush('系统', null, `${S.name}，欢迎回到江湖。附近＝同一张地图，门派＝同门，江湖＝所有在线的人。`);
