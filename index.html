<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>江湖少年</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="江湖少年">
<meta name="theme-color" content="#0f380f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none}</style>
</head>
<body>
<style>
:root{
  /* Layout: the game picture fills the whole screen; GB-style controls float over it */
  --bg:#0f380f;
  --pad:rgba(28,30,34,.62);
  --pad-on:rgba(28,30,34,.88);
  --btn:rgba(140,42,51,.66);
  --btn-on:rgba(140,42,51,.92);
  --pill:rgba(110,108,100,.62);
  --label:rgba(232,240,200,.85);
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--bg);margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.game{position:relative;width:100%;height:100%;overflow:hidden}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ctl{
  position:absolute;left:0;right:0;bottom:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 14px;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:end;row-gap:10px;
}
.ctl > *{pointer-events:auto}
.dpad{grid-column:1;grid-row:1;width:148px;height:148px;position:relative;touch-action:none;cursor:pointer;border-radius:50%;background:var(--pad);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.dpad i{position:absolute;z-index:1;width:0;height:0;border:8px solid transparent;opacity:.55}
.dpad i.u{left:66px;top:12px;border-bottom-color:#e6e6e6;border-top:0}
.dpad i.d{left:66px;bottom:12px;border-top-color:#e6e6e6;border-bottom:0}
.dpad i.l{top:66px;left:12px;border-right-color:#e6e6e6;border-left:0}
.dpad i.r{top:66px;right:12px;border-left-color:#e6e6e6;border-right:0}
.dpad i.on{opacity:1}
.knob{position:absolute;left:46px;top:46px;width:56px;height:56px;border-radius:50%;background:rgba(70,72,78,.85);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.12);pointer-events:none;transition:transform .06s}
.dpad.active .knob{transition:none}
.ab{grid-column:3;grid-row:1;display:flex;gap:14px;transform:rotate(-22deg);padding:0 4px 8px 0}
.btn{display:flex;flex-direction:column;align-items:center;gap:5px}
.btn button{width:62px;height:62px;border-radius:50%;border:0;background:var(--btn);color:#f6e6e6;font:700 20px/1 var(--sans);touch-action:none;cursor:pointer}
.btn button.on{background:var(--btn-on)}
.ab .btn:first-child{margin-top:28px}
.btn span,.small span{font:700 10px/1 var(--sans);letter-spacing:.1em;color:var(--label);text-shadow:0 1px 2px rgba(0,0,0,.7)}
.smalls{grid-column:1/4;grid-row:2;display:flex;justify-content:center;gap:28px}
.small{display:flex;flex-direction:column;align-items:center;gap:5px}
.small button{width:72px;height:30px;border-radius:15px;border:0;background:var(--pill);touch-action:none;cursor:pointer}
.small button.on{background:var(--pad-on)}
button:focus-visible{outline:2px solid #e0f8d0;outline-offset:3px}
.namebox[hidden]{display:none}
.namebox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,56,15,.55);z-index:5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nb-card{background:#9bbc0f;border:4px solid #0f380f;box-shadow:0 0 0 3px #9bbc0f,0 0 0 6px #0f380f;padding:18px 16px;width:min(300px,100%);display:flex;flex-direction:column;gap:12px;font:700 15px/1.3 var(--sans);color:#0f380f}
.nb-title{font-size:16px;letter-spacing:.06em}
.nb-sub{font-weight:500;font-size:12px;color:#306230}
#nameinput{font:700 20px/1.2 var(--sans);color:#0f380f;background:#8bac0f;border:3px solid #0f380f;padding:8px 10px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text;border-radius:0}
#nameinput:focus{outline:2px dashed #306230;outline-offset:2px}
.nb-row{display:flex;gap:10px}
.nb-row button{flex:1;font:700 15px/1 var(--sans);padding:11px 0;border:3px solid #0f380f;background:#8bac0f;color:#0f380f;cursor:pointer;border-radius:0}
.nb-row button.main{background:#0f380f;color:#9bbc0f}
.nb-err{min-height:14px;font-size:12px;color:#306230}
#savecode{font:500 11px/1.35 ui-monospace,Menlo,monospace;color:#0f380f;background:#8bac0f;border:3px solid #0f380f;padding:6px 8px;width:100%;height:120px;box-sizing:border-box;resize:none;word-break:break-all;-webkit-user-select:text;user-select:text;border-radius:0}
@media (orientation:landscape){
  .ctl{top:0;align-items:center;padding-block:0 10px}
  .dpad{grid-row:1/3}
  .ab{grid-row:1/3}
  .smalls{grid-column:auto;grid-row:auto;position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));justify-content:space-between;pointer-events:none}
  .smalls .small{pointer-events:auto;flex-direction:row}
  .small button{width:64px;height:28px}
  .rotate{display:none !important}
}
.rotate{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0f380f;color:#9bbc0f;font:700 18px/1.4 var(--sans);text-align:center;padding:24px}
.rotate[hidden]{display:none}
.rotate .ph{width:54px;height:90px;border:4px solid #9bbc0f;border-radius:10px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.rotate small{font-weight:500;font-size:13px;color:#8bac0f}
.rotate button{font:700 14px/1 var(--sans);padding:10px 18px;border:3px solid #9bbc0f;background:transparent;color:#9bbc0f;border-radius:0;cursor:pointer}
</style>

<div class="game" id="game">
  <div class="namebox" id="namebox" hidden>
    <form class="nb-card" id="nbform" autocomplete="off">
      <div class="nb-title" id="nbtitle">少侠尊姓大名？</div>
      <div class="nb-sub">名字会显示在人物头顶，一到六个字。</div>
      <input id="nameinput" maxlength="6" placeholder="例如：张无忌" aria-label="角色名字">
      <div class="nb-err" id="nberr"></div>
      <div class="nb-row"><button type="button" id="nbrand">随机一个</button><button type="submit" class="main" id="nbok">行走江湖</button></div>
    </form>
  </div>
  <div class="namebox" id="savebox" hidden>
    <div class="nb-card">
      <div class="nb-title" id="sbtitle">存档码</div>
      <div class="nb-sub" id="sbsub"></div>
      <textarea id="savecode" spellcheck="false" aria-label="存档码"></textarea>
      <div class="nb-err" id="sberr"></div>
      <div class="nb-row"><button type="button" id="sbclose">关闭</button><button type="button" class="main" id="sbok">复制</button></div>
    </div>
  </div>
  <div class="rotate" id="rotate"><div class="ph"></div><div>请把手机横过来玩</div><small>横屏画面更宽，按键在两侧，双手握持更顺手。<br>iPhone 请先在控制中心关闭「竖排方向锁定」。</small><button type="button" id="rotok">仍用竖屏</button></div>
  <canvas id="screen" aria-label="游戏画面"></canvas>
  <div class="ctl" id="ctl">
    <div class="dpad" id="dpad" aria-label="方向键"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><span class="knob" id="knob"></span></div>
    <div class="ab">
      <div class="btn"><button data-k="b" aria-label="B 打坐或返回">B</button><span>打坐·返回</span></div>
      <div class="btn"><button data-k="a" aria-label="A 攻击或确定">A</button><span>攻击·确定</span></div>
    </div>
    <div class="smalls">
      <div class="small"><button data-k="select" aria-label="SELECT 换武器"></button><span>换武器</span></div>
      <div class="small"><button data-k="start" aria-label="START 菜单"></button><span>菜单</span></div>
    </div>
  </div>
</div>

function questMark(n) {
  const q = S.q;
  switch (n.id) {
    case 'chief': return q.main === 0 ? '!' : (q.main < CH1_END && mainDone()) ? '?' : null;
    case 'doctor': { const s = S.side.lianyao || 0; return s === 0 ? '!' : (s === 1 && S.items.caoyao >= 5) ? '?' : null; }
    case 'smith': { const s = S.side.duanzao || 0; return (s === 0 && q.main >= 2) ? '!' : (s === 1 && S.items.langpi >= 3) ? '?' : null; }
    case 'tao':
      if (S.sect === 'quanzhen' && (hasGift('quanzhen') || (S.stask && S.stask.sect === 'quanzhen' && sectTaskDone(S.stask)))) return '?';
      if (S.skills.quanzhen == null) return bestAtk() >= 5 ? '!' : null;
      if (!S.sect && lv('quanzhen') >= 10) return '!';
      return S.sect === 'quanzhen' && canLearnSect('quanzhen') ? '!' : null;
    case 'fangzhang': case 'shitai': case 'mjshi': case 'chiyan': case 'huadaozhu': {
      const sect = { fangzhang: 'shaolin', shitai: 'emei', mjshi: 'mingjiao', chiyan: 'riyue', huadaozhu: 'taohua' }[n.id];
      if (S.purge && S.purge.sect === sect && S.purge.done) return '?';
      if (S.sect === sect && (hasGift(sect) || (S.stask && S.stask.sect === sect && sectTaskDone(S.stask)))) return '?';
      if (!S.sect) return SECT_JOIN[sect].ok() && !campBlock(sect) ? '!' : null;
      return S.sect === sect && canLearnSect(sect) ? '!' : null;
    }
    case 'fisher': return !S.items.yugan ? '!' : null;
    case 'caifeng': { const s2 = S.side.fangzhi || 0; return s2 === 0 ? '!' : (s2 === 1 && S.items.mianhua >= 3) ? '?' : null; }
    case 'inn': { const s2 = S.side.pengren || 0; return (s2 === 0 && S.items.yugan) ? '!' : (s2 === 1 && S.items.jiyu >= 3) ? '?' : null; }
    case 'baixiao': { if (q.main === CH1_END) return '!'; if (q.main > CH1_END && q.main < MAIN_END && mainDone()) return '?'; const t = curTrial(); if (t && trialDone(t)) return '?'; return !S.llCur && nextTrial() ? '!' : null; }
    case 'biaotou': return !S.bounty ? '!' : S.bounty.cnt >= S.bounty.need ? '?' : null;
    case 'lu':
      if (S.sect === 'gaibang' && (hasGift('gaibang') || (S.stask && S.stask.sect === 'gaibang' && sectTaskDone(S.stask)))) return '?';
      if (!S.sect) { const s = S.side.gaibang || 0; return s === 0 ? '!' : S.items.tourou >= 5 ? '?' : null; }
      return S.sect === 'gaibang' && canLearnSect('gaibang') ? '!' : null;
  }
  return null;
}

function spareGear() {

/* 生产：成功率看熟练度，失败损耗一半材料；做得越多手艺越好 */
function craft(who, list, skill, back) {
  const v = lv(skill);
  const rate = d => Math.round(clamp(60 + v * 0.8 - d, 10, 98));
  const matTxt = m => Object.entries(m).map(([k, n]) => `${ITEMS[k].name}${n}`).join('');
  ask(who, `你的${SK[skill].name}是 ${v.toFixed(2)}，手艺越好越不容易失败。`, list.map(([id, m, d]) => `${nameOf(id)} ${matTxt(m)} ${rate(d)}%`).concat(['返回']), i => {
    if (i >= list.length) return back();
    const [id, m, d] = list[i];
    const lack = Object.entries(m).find(([k, n]) => (S.items[k] || 0) < n);
    if (lack) return say(who, `${ITEMS[lack[0]].name}不够，要 ${lack[1]} 个，你只有 ${S.items[lack[0]] || 0} 个。`, () => craft(who, list, skill, back));
    const ok = Math.random() * 100 < rate(d);
    for (const [k, n] of Object.entries(m)) S.items[k] -= ok ? n : Math.ceil(n / 2);
    if (ok) {
      if (EQ[id]) S.gear.push(id); else S.items[id] = (S.items[id] || 0) + 1;
      train(skill, 8); sfx('coin'); save();
      say(who, `成了！得到 ${nameOf(id)}。${EQ[id] ? '在菜单“装备”里可以换上，多余的可以卖给兵器铺。' : ''}`, () => craft(who, list, skill, back));
    } else { train(skill, 3); sfx('hurt'); save(); say(who, '火候没掌握好，失败了……材料损耗了一半。', () => craft(who, list, skill, back)); }
  });
}

    S.st = Math.min(maxST(), S.st + (P.sit ? 0.35 : resting ? 0.12 : 0.06));
    for (const k of ['head', 'arm', 'leg']) S.parts[k] = Math.min(maxPart(), S.parts[k] + pr);
    if (P.sit && !wasFull && allFull()) toast('气息圆满，伤势尽复');
    if (P.sit) train(S.passive['心法'], 0.012);
  }
  if (++saveTimer > 60 * 30) { saveTimer = 0; save(); }
}

function loop(t) {
  acc += Math.min(100, t - last); last = t;

}
